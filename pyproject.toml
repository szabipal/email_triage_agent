[project]
name = "email-agent"
version = "0.1.0"
description = "AI-powered email triage and prioritization system."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pyright>=1.1.411",
    "pytest>=8.0",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py312"
src = ["src"]
line-length = 88
exclude = [
    ".git",
    ".pytest_cache",
    ".pyright",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "htmlcov",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.pyright]
include = [
    "src/email_agent",
    "tests",
]
exclude = [
    ".git",
    ".pytest_cache",
    ".pyright",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "htmlcov",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
