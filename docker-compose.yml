services:
  api:
    build: .
    environment:
      EMAIL_AGENT_DATABASE_URL: sqlite:////tmp/email_agent.db
    ports:
      - "8000:8000"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
