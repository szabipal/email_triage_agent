services:
  api:
    build: .
    environment:
      EMAIL_AGENT_DATABASE_URL: sqlite:////data/email_agent.db
      EMAIL_AGENT_VECTOR_STORE_PATH: /data/chroma
      EMAIL_AGENT_ALLOWED_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    volumes:
      - email-agent-data:/data
    ports:
      - "8000:8000"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: http://localhost:8000
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"

volumes:
  email-agent-data:
